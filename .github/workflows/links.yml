name: Check links

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          # 403/429: publishers (Science, T&F, Emerald, Reddit) block bots but links are valid
          args: >-
            --no-progress
            --max-retries 3
            --accept 200,203,403,429
            README.md CONTRIBUTING.md
          fail: true
